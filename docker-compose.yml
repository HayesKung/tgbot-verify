services:
  tgbot:
    build: .
    container_name: sheerid-tgbot
    restart: unless-stopped

    # 环境变量
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # Telegram Bot 配置
      - BOT_TOKEN=${BOT_TOKEN}
      - CHANNEL_USERNAME=${CHANNEL_USERNAME:-pk_oa}
      - CHANNEL_URL=${CHANNEL_URL:-https://t.me/pk_oa}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      # MySQL配置
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-tgbot_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-tgbot_user}
      - MYSQL_DB_NAME=${MYSQL_DB_NAME:-${MYSQL_DATABASE:-tgbot_verify}}
      # 代理（容器内 127.0.0.1 是容器自身，必须指向宿主机的代理；10808 监听在 Docker 网关上，host.docker.internal 可达）
      - HTTP_PROXY=http://host.docker.internal:10808
      - HTTPS_PROXY=http://host.docker.internal:10808
      # 本地地址不走代理：MySQL 经 host.docker.internal 直连宿主
      - NO_PROXY=host.docker.internal,localhost,127.0.0.1
      # Playwright 浏览器路径：容器内必须用 Linux 绝对路径，不能用 .env 里的 Windows 路径
      # （Dockerfile 已 `playwright install chromium` 装到该默认目录；此行会压过 .env 的 D:/... 路径，
      #  因为 python-dotenv 的 load_dotenv() 默认不覆盖已存在的环境变量）
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright

    # 日志持久化
    volumes:
      - ./logs:/app/logs

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 网络模式
    network_mode: bridge
